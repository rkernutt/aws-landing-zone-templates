name: Validate template pack

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-docx openpyxl python-pptx

      - name: Install LibreOffice (for xlsx recalc)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-core libreoffice-calc

      - name: Leak check — no customer-specific terms outside Scripts/legacy
        run: python tools/leak_check.py "${{ github.workspace }}"

      - name: Validate Word documents
        run: |
          python - <<'PY'
          import sys, zipfile, pathlib
          from xml.etree import ElementTree as ET
          fails = []
          for p in pathlib.Path(".").glob("*.docx"):
              with zipfile.ZipFile(p) as z:
                  for name in z.namelist():
                      if name.endswith(".xml"):
                          try:
                              ET.fromstring(z.read(name))
                          except ET.ParseError as e:
                              fails.append(f"{p}::{name} — {e}")
          if fails:
              print("Word validation FAILED:")
              [print("  " + f) for f in fails]
              sys.exit(1)
          print("Word validation OK")
          PY

      - name: Validate PowerPoint
        run: |
          python - <<'PY'
          import sys, zipfile, pathlib
          from xml.etree import ElementTree as ET
          fails = []
          for p in pathlib.Path(".").glob("*.pptx"):
              with zipfile.ZipFile(p) as z:
                  for name in z.namelist():
                      if name.endswith(".xml"):
                          try:
                              ET.fromstring(z.read(name))
                          except ET.ParseError as e:
                              fails.append(f"{p}::{name} — {e}")
          if fails:
              print("PPT validation FAILED:")
              [print("  " + f) for f in fails]
              sys.exit(1)
          print("PPT validation OK")
          PY

      - name: Validate Excel formulas (recalc & scan for errors)
        run: |
          python - <<'PY'
          import subprocess, sys, pathlib, json, os, tempfile, shutil
          errors = []
          for p in pathlib.Path(".").glob("*.xlsx"):
              # Use LibreOffice to convert + recalc
              tmpdir = tempfile.mkdtemp()
              subprocess.run(
                  ["soffice", "--headless", "--calc",
                   "--convert-to", "xlsx",
                   "--outdir", tmpdir, str(p)],
                  check=True, capture_output=True,
              )
              # Scan the recalculated file for Excel error tokens
              import openpyxl
              recalc = list(pathlib.Path(tmpdir).glob("*.xlsx"))[0]
              wb = openpyxl.load_workbook(recalc, data_only=True)
              bad = ("#REF!", "#DIV/0!", "#VALUE!", "#NAME?", "#N/A", "#NUM!", "#NULL!")
              for sn in wb.sheetnames:
                  ws = wb[sn]
                  for row in ws.iter_rows():
                      for c in row:
                          if isinstance(c.value, str) and c.value in bad:
                              errors.append(f"{p.name}::{sn}!{c.coordinate} = {c.value}")
              shutil.rmtree(tmpdir, ignore_errors=True)
          if errors:
              print("Excel formula errors:")
              [print("  " + e) for e in errors]
              sys.exit(1)
          print("Excel validation OK")
          PY

      - name: Summary
        if: success()
        run: echo "All validations passed."
